{% load static %}
<link rel="stylesheet" href="{% static 'css/sidebar.css' %}">

<aside class="sidebar">
  <div class="avatar"></div>
  <div class="name">{{ user.first_name|default:'Prashant' }} {{ user.last_name|default:'Kumar' }}</div>
  <div class="role">student</div>
  <nav>
    <a href="/dashboard/" class="nav-card {% if request.path == '/dashboard/' %} active{% endif %}">
      <span class="nav-icon">👤</span>
      <span class="nav-text">Profile</span>
    </a>
    <a href="/dashboard/gatepassform/" class="nav-card{% if request.path == '/dashboard/gatepassform/' %} active{% endif %}">
      <span class="nav-icon">📝</span>
      <span class="nav-text">GatePass Form</span>
    </a>
    <a href="/dashboard/applications/" class="nav-card{% if request.path == '/dashboard/applications/' %} active{% endif %}">
      <span class="nav-icon">📄</span>
      <span class="nav-text">Applications</span>
    </a>
    <a href="/dashboard/changepassword/" class="nav-card{% if request.path == '/dashboard/changepassword/' %} active{% endif %}">
      <span class="nav-icon">🔒</span>
      <span class="nav-text">Change Password</span>
    </a>
    <form action="{% url 'logout' %}" method="post" style="margin:0;">
      {% csrf_token %}
      <button type="submit" class="nav-card logout-link">
        <span class="nav-icon">🚪</span>
        <span class="nav-text">Logout</span>
      </button>
    </form>
  </nav>
</aside>
